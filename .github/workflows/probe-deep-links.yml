# Throwaway probe (deleted after use): how does EAS Hosting route directory index pages?
name: probe-deep-links
on:
  push:
    branches: [probe/deep-links]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI: eas-cli@27.10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Probe A - plain static variants
        run: |
          set -e
          mkdir -p pa/b pa/c pa/d pa/_expo
          for f in index a b/index c c/x d/index d; do echo "<html><body>FILE:$f</body></html>" > "pa/$f.html"; done
          echo "<html><body>FILE:notfound</body></html>" > "pa/+not-found.html"
          npx --yes $EAS_CLI deploy --non-interactive --export-dir pa --json > a.json 2> a.err || { cat a.err; exit 1; }
          U=$(jq -r '.deployment.url // .url' a.json); echo "URL=$U"; sleep 20
          for p in a a.html b b/ b/index c c/ c/x d d/ d.html zz; do
            r=$(curl -s -o body -w '%{http_code} %{redirect_url}' "$U/$p"); echo "A /$p -> $r [$(grep -o 'FILE:[a-z/]*' body || true)]"
          done
      - name: Probe B - real app, server output
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: probe
          EXPO_PUBLIC_APP_ENV: development
        run: |
          set -e
          jq '.expo.web.output = "server"' app.json > app2.json && mv app2.json app.json
          npx expo export -p web --output-dir distb
          ls distb; ls distb/server 2>/dev/null | head; cat distb/server/_expo/routes.json 2>/dev/null | head -c 1500; echo
          npx --yes $EAS_CLI deploy --non-interactive --export-dir distb --json > b.json 2> b.err || { cat b.err; exit 1; }
          U=$(jq -r '.deployment.url // .url' b.json); echo "URL=$U"; sleep 20
          for p in "" home users users/ users/new plant issues readings console zz; do
            r=$(curl -s -D hdr -o body -w '%{http_code} %{redirect_url}' "$U/$p"); echo "B /$p -> $r csp=$(grep -ci content-security-policy hdr) title=$(grep -o '<title>[^<]*' body | head -1)"
          done
