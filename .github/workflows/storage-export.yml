# Nightly copy of prod photos (Storage bucket `attachments`) to the S3 backup bucket in ap-south-1 (R1, owner 2026-11-26).
# Supabase Pro backups cover the database only; this job is the photo half. Read-only on prod, add-only on S3 (the IAM key can list and
# put, never delete; bucket versioning keeps any older copy). Secrets live in GitHub environment `prod-backup` (main only, no reviewer,
# so the nightly runs unattended): PROD_SUPABASE_SERVICE_ROLE_KEY, BACKUP_S3_BUCKET, BACKUP_AWS_ACCESS_KEY_ID,
# BACKUP_AWS_SECRET_ACCESS_KEY. A failed scheduled run opens or updates the issue "Prod photo backup failing".
name: storage-export

on:
  schedule:
    - cron: '17 20 * * *' # 01:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-export
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod-backup
    env:
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      PROD_SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
      DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Copy new prod photos to the S3 backup
        run: npx tsx scripts/storage-export.ts

  notify:
    needs: export
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update the "Prod photo backup failing" issue
        run: |
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list -R "${{ github.repository }}" --state open --search 'in:title "Prod photo backup failing"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${{ github.repository }}" --body "Failed again: $run"
          else gh issue create -R "${{ github.repository }}" --title "Prod photo backup failing" --body "The nightly copy of prod photos to S3 failed: $run"; fi
