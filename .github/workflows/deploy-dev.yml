# Deploys main to DEV: applies migrations, publishes the web build on EAS Hosting (alias "dev"),
# and records the response headers (plan step 9 decision point). Never touches staging/prod.
name: deploy-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One writer at a time on hosted dev (dev-reset D6): shared with the dev regression, which rebuilds the database.
concurrency:
  group: dev-db
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@27.10.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DEV_SUPABASE_DB_URL: ${{ secrets.DEV_SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      # S8 (dev-reset D7): a hosted proof on a feature branch leaves that branch's migrations on dev. `db push` of main would then fail on the
      # remote-only versions, so when dev holds a version main lacks, dev is rebuilt first (migrations + fixtures + demo tenant), exactly as a nightly would.
      - name: Rebuild dev first when it holds migrations main does not have
        env:
          APP_ENV: development
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.DEV_SUPABASE_DB_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
        run: |
          out="$(npx supabase migration list --db-url "$DEV_SUPABASE_DB_URL" 2>&1)" || { echo "$out" | sed -E 's#postgres(ql)?://[^ ]*#<redacted>#g'; exit 1; }
          remote_only="$(echo "$out" | bash scripts/drift-check.sh --remote-only)"
          if [ -n "$remote_only" ]; then
            echo "dev holds migration(s) main does not have: $(echo $remote_only); rebuilding dev from main"
            npm run dev:reset
          else
            echo "dev has no migration main lacks"
          fi

      - name: Apply migrations to dev
        run: npx supabase db push --db-url "$DEV_SUPABASE_DB_URL" --include-all --yes

      - name: Deploy Edge Functions to dev (02 D4-D8, 03 platform + platform-setup; PLATFORM_SETUP_TOKEN is never set here)
        run: npx supabase functions deploy user-admin account platform platform-setup --project-ref "$DEV_SUPABASE_PROJECT_REF" --use-api --yes

      - name: Set function secrets (CORS origin of the dev web app, D8)
        run: npx supabase secrets set ALLOWED_ORIGINS=https://mouldtrack--dev.expo.app --project-ref "$DEV_SUPABASE_PROJECT_REF" --yes

      - name: Dev never holds a setup token (D11, idempotent, unset if present then verify, values never printed)
        run: |
          has_token() { npx supabase secrets list --project-ref "$DEV_SUPABASE_PROJECT_REF" -o json 2>/dev/null | jq -e '[.[] | select(.name == "PLATFORM_SETUP_TOKEN")] | length > 0' >/dev/null; }
          if has_token; then
            npx supabase secrets unset PLATFORM_SETUP_TOKEN --project-ref "$DEV_SUPABASE_PROJECT_REF" --yes
          fi
          if has_token; then echo "PLATFORM_SETUP_TOKEN still present on dev"; exit 1; fi
          echo "no PLATFORM_SETUP_TOKEN on dev"

      - name: Apply hosted Auth config to dev (D9)
        run: node scripts/auth-config.mjs --apply --ref dev

      - name: Ensure EAS project exists (first run prints the projectId to commit)
        run: |
          if [ -z "$(jq -r '.expo.extra.eas.projectId // empty' app.json)" ]; then
            npx --yes $EAS_CLI init --non-interactive --force
            echo "EAS_PROJECT_ID=$(jq -r '.expo.extra.eas.projectId' app.json) OWNER=$(jq -r '.expo.owner // "n/a"' app.json)"
            echo "### EAS projectId (commit into app.json → expo.extra.eas.projectId)" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$(jq -r '.expo.extra.eas.projectId' app.json)\` owner: \`$(jq -r '.expo.owner // "n/a"' app.json)\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build web (development)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npx expo export -p web --output-dir dist

      - name: Deploy to EAS Hosting (alias dev)
        id: deploy
        run: |
          npx --yes $EAS_CLI deploy --non-interactive --export-dir dist --alias dev --json > deploy.json 2> deploy.err || { cat deploy.err; exit 1; }
          echo "--- deploy.json"; cat deploy.json; echo "--- deploy.err (tail)"; tail -5 deploy.err
          url=$(jq -r '.aliases[0]?.url // .url // .deploymentUrl // empty' deploy.json 2>/dev/null)
          [ -n "$url" ] || url=$(grep -Eo 'https://[a-z0-9.-]+\.expo\.app[^" ]*' deploy.json deploy.err | head -1 | cut -d: -f2-)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Dev web URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record response headers
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url"); [ "$code" = "200" ] && break; sleep 5
          done
          echo "HTTP $code"
          { echo '### Response headers (step 9 decision input)'; echo '```'; curl -sI "$url" | grep -iE '^(HTTP|content-security-policy|x-content-type-options|referrer-policy|strict-transport-security|x-frame-options|permissions-policy|server|cache-control)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for p in / /sign-in /home /_expo/.routes.json; do echo "--- $p"; curl -sI "$url$p" | grep -viE '^(date|cf-ray|alt-svc|nel|report-to|set-cookie):'; done
          [ "$code" = "200" ]
