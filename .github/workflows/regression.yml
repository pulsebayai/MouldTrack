# Regression (architecture.md §Release & regression policy 2–3).
# Nightly 02:30 IST against DEV: drift check + full web suite + Android Maestro on an emulator.
# Manual: target dev | staging (full suite) | prod (SMOKE ONLY, read-only). One run per target at a time.
name: regression

on:
  schedule:
    - cron: '0 21 * * *' # 02:30 IST
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment'
        type: choice
        options: [dev, staging, prod]
        default: dev
      base_url:
        description: 'Web URL (defaults per target)'
        required: false

permissions:
  contents: read
  issues: write

# One writer at a time on hosted dev (dev-reset D6): the dev regression (which rebuilds the database) and deploy-dev (which migrates it) share this group.
concurrency:
  group: ${{ (inputs.target || 'dev') == 'dev' && 'dev-db' || format('regression-{0}', inputs.target) }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'dev' }}
  NODE_VERSION: '22'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.t.outputs.target }}
      base_url: ${{ steps.t.outputs.base_url }}
      full: ${{ steps.t.outputs.full }}
    steps:
      - id: t
        run: |
          t="$TARGET"
          case "$t" in
            dev) def="https://mouldtrack--dev.expo.app"; full=true ;;
            staging) def="https://mouldtrack--staging.expo.app"; full=true ;;
            prod) def="https://mouldtrack.expo.app"; full=false ;;
            *) echo "unknown target $t"; exit 1 ;;
          esac
          url="${{ inputs.base_url }}"; url="${url:-$def}"
          echo "target=$t" >> "$GITHUB_OUTPUT"; echo "base_url=$url" >> "$GITHUB_OUTPUT"; echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Target: $t · URL: $url · full suite: $full"

  drift:
    needs: setup
    if: needs.setup.outputs.target == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Dev has exactly the repo's migrations (AC-12)
        env: { DEV_SUPABASE_DB_URL: '${{ secrets.DEV_SUPABASE_DB_URL }}' }
        run: |
          mkdir -p test-results
          if bash scripts/drift-check.sh; then r=0; else r=1; fi
          printf 'TAP version 13\n%s 1 - dev migrations match repo\n1..1\n' "$([ $r = 0 ] && echo ok || echo 'not ok')" > test-results/drift.tap
          exit $r
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'regression-drift', path: test-results/, retention-days: 90, if-no-files-found: warn }

  # dev-reset D2: runs AFTER drift (so drift still proves deploy-dev's incremental apply on the un-reset database) and BEFORE everything that
  # reads or writes data. Dev only: the job condition and the script's own guard both refuse any other project.
  reset:
    needs: [setup, drift]
    if: ${{ !cancelled() && needs.setup.outputs.target == 'dev' }} # a failed drift must not stop the reset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.DEV_SUPABASE_DB_URL }}
      DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
      # S5: the guard refuses when STAGING_SUPABASE_PROJECT_REF / PROD_SUPABASE_PROJECT_REF are passed and equal the dev ref (or are passed empty).
      # Neither secret exists yet (the first hosted attempt was refused for the empty staging value, as designed), so neither is passed. Add
      # `STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}` (and the prod one) here when those projects' secrets exist (R1 release).
      E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
      # S6: bounds on the database after a reset, taken from the hosted run 44299307195 (auth log 0 rows, database 15 MB) with headroom
      MAX_AUDIT_LOG_ROWS: '50' # hosted reset job: 0 after dev-reset (run 44299307195)
      MAX_DB_MB: '60' # hosted: 15 MB after the reset (run 44299307195)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: command -v psql >/dev/null || { sudo apt-get update -y && sudo apt-get install -y postgresql-client; }
      - name: Rebuild dev (migrations + canonical fixtures + demo tenant), then check it holds exactly one run's data
        run: |
          mkdir -p test-results
          reset=1; size=1
          if npm run -s dev:reset > test-results/dev-reset.log 2>&1; then reset=0; fi
          cat test-results/dev-reset.log
          if [ $reset = 0 ]; then
            if npm run -s dev:size-check > test-results/counts.txt 2> test-results/size-check.err; then size=0; fi
            cat test-results/counts.txt test-results/size-check.err
          fi
          bounds=1
          if [ $reset = 0 ]; then
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v max_audit="$MAX_AUDIT_LOG_ROWS" -v max_db_mb="$MAX_DB_MB" -f scripts/dev-bounds.sql > test-results/bounds.log 2>&1; then bounds=0; fi
            cat test-results/bounds.log
          fi
          tap() { [ "$1" = 0 ] && echo "ok $2 - $3" || echo "not ok $2 - $3"; }
          { echo 'TAP version 13'; tap $reset 1 'dev rebuilt from migrations + fixtures + demo tenant'; tap $size 2 'dev holds exactly the one-run baseline'; tap $bounds 3 'auth audit log and database size within bounds'; echo '1..3'; } > test-results/reset.tap
          [ $reset = 0 ] && [ $size = 0 ] && [ $bounds = 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'regression-reset', path: test-results/, retention-days: 90, if-no-files-found: warn }

  web:
    needs: [setup, reset]
    # reset is skipped for staging/prod; on dev a failed or cancelled reset stops the run before anything touches the data
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.reset.result == 'success' || needs.reset.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ needs.setup.outputs.base_url }}
      E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
      # API project (02 D10): Auth, PostgREST and the Edge Functions of the target project. Dev only; staging joins at the R1 release.
      E2E_API_URL: ${{ needs.setup.outputs.target == 'dev' && secrets.DEV_SUPABASE_URL || '' }}
      E2E_ANON_KEY: ${{ needs.setup.outputs.target == 'dev' && secrets.DEV_SUPABASE_ANON_KEY || '' }}
      E2E_SERVICE_ROLE_KEY: ${{ needs.setup.outputs.target == 'dev' && secrets.DEV_SUPABASE_SERVICE_ROLE_KEY || '' }}
      E2E_REQUIRE_API: ${{ needs.setup.outputs.target == 'dev' && '1' || '' }} # a missing API env on dev is a failure, never a skip (R9)
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # Dev fixtures were recreated by the `reset` job (dev-reset); no separate fixtures step is needed here.
      - run: npx playwright install --with-deps chromium
      - name: Playwright (full on dev/staging, smoke only on prod)
        run: |
          if [ "${{ needs.setup.outputs.full }}" = "true" ]; then npx playwright test; else npx playwright test --project smoke; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-web
          path: |
            test-results/
            playwright-report/
          retention-days: 90
          if-no-files-found: warn

  hosted-checks:
    needs: [setup, reset, web] # after reset (dev starts from the rebuilt database) and web (it checks the state the e2e run leaves behind)
    # dev: all checks. staging: only the Auth config check (AC-15, R4); the rest stay dev-only. Never after a failed or cancelled reset on dev.
    if: ${{ !cancelled() && (needs.setup.outputs.target == 'dev' || needs.setup.outputs.target == 'staging') && (needs.reset.result == 'success' || needs.reset.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ needs.setup.outputs.target }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      APP_ENV: development
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
      WEB_ORIGIN: ${{ needs.setup.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Auth config, functions deployed, no orphan users, CORS (read-only)
        run: bash scripts/hosted-checks.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'regression-hosted', path: test-results/, retention-days: 90, if-no-files-found: warn }

  android:
    needs: [setup, reset, web] # on dev the reset job rebuilt the fixtures; the dev-only step below re-resets them for U4
    if: ${{ !cancelled() && needs.setup.outputs.full == 'true' && needs.web.result != 'skipped' && (needs.reset.result == 'success' || needs.reset.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ needs.setup.outputs.target == 'dev' && secrets.DEV_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ needs.setup.outputs.target == 'dev' && secrets.DEV_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_APP_ENV: ${{ needs.setup.outputs.target == 'dev' && 'development' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - name: Reset fixtures again (web e2e changed U4's password; first-sign-in needs it fresh). Dev only.
        if: needs.setup.outputs.target == 'dev'
        env:
          APP_ENV: development
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
          E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
        run: npm run fixtures:reset
      - name: Build release APK on the runner (no EAS credits)
        run: bash scripts/build-android-ci.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Maestro on emulator (01 AC-1, 2, 3, 5 + 02 first-sign-in)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            mkdir -p test-results && maestro test e2e/maestro --env PASSWORD="$PASSWORD" --format junit --output test-results/junit-android.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'regression-android', path: test-results/, retention-days: 90, if-no-files-found: warn }

  evidence:
    needs: [setup, drift, reset, hosted-checks, web, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { path: evidence, pattern: 'regression-*' }
      - name: Summary
        run: |
          node scripts/regression-summary.mjs evidence --title "Regression — ${{ needs.setup.outputs.target }}" \
            --env "${{ needs.setup.outputs.target }}" --target-url "${{ needs.setup.outputs.base_url }}" | tee summary.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p evidence && cp summary.md evidence/SUMMARY.md
      - uses: actions/upload-artifact@v4
        with: { name: 'regression-evidence-${{ needs.setup.outputs.target }}', path: evidence/, retention-days: 90 }
      - name: Fail if any suite failed
        run: |
          r='${{ needs.drift.result }} ${{ needs.reset.result }} ${{ needs['hosted-checks'].result }} ${{ needs.web.result }} ${{ needs.android.result }}'
          echo "results: $r"; ! echo "$r" | grep -Eq 'failure|cancelled'

  # S1 (dev-reset D6): deploy-dev and the dev regression share concurrency group dev-db, and GitHub keeps only ONE pending run per group (a newer
  # pending deploy replaces an older one), so a merge during a long nightly can lose its deploy. This last job closes the gap: when the newest
  # successful deploy-dev run is not main's head, it dispatches deploy-dev on main (queued behind this run in the same group).
  redeploy:
    needs: [setup, evidence]
    if: ${{ always() && needs.setup.outputs.target == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch deploy-dev on main when dev is behind main
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
        run: |
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          deployed=$(gh api "repos/$REPO/actions/workflows/deploy-dev.yml/runs?status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          echo "main=$main last-successful-deploy-dev=${deployed:-none}"
          if [ "$main" != "$deployed" ]; then
            gh api -X POST "repos/$REPO/actions/workflows/deploy-dev.yml/dispatches" -f ref=main
            echo "dispatched deploy-dev on main"
          else
            echo "dev already deployed from main's head"
          fi

  notify:
    needs: [setup, evidence]
    # a scheduled run that failed OR was cancelled (evidence is always() and fails when any suite is cancelled)
    if: ${{ always() && github.event_name == 'schedule' && (needs.evidence.result == 'failure' || needs.evidence.result == 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update "Nightly regression failing" issue
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list -R "${{ github.repository }}" --state open --search 'in:title "Nightly regression failing"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${{ github.repository }}" --body "Failed again: $run"
          else gh issue create -R "${{ github.repository }}" --title "Nightly regression failing" --assignee "${{ github.repository_owner }}" --body "Nightly regression against dev failed or was cancelled: $run. Fixing this is the top priority for the next session (AI-native SDLC Stage 6)." || \
               gh issue create -R "${{ github.repository }}" --title "Nightly regression failing" --body "Nightly regression against dev failed or was cancelled: $run"; fi
