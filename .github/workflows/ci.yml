# PR CI — full suite except Android e2e (owner exception, architecture.md §Release & regression policy 1).
# Uses NO secrets: every DB/e2e job runs its own ephemeral Supabase built only from supabase/migrations.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Local Supabase only (CLI defaults); never hosted values here.
  SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!sdlc/**'
              - '!**/*.md'

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:15321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      EXPO_PUBLIC_APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Edge Functions type-check and lint (R9)
        # Copied out of the repo: the root package.json would make Deno resolve the app's types.
        run: |
          rm -rf "$RUNNER_TEMP/fn" && cp -r supabase/functions "$RUNNER_TEMP/fn"
          cd "$RUNNER_TEMP/fn" && deno check */index.ts && deno lint
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-static
          path: test-results/
          retention-days: 90
          if-no-files-found: warn

  db:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Start ephemeral Supabase (migrations + seed only)
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: TEMP privilege snapshot (chore/explicit-grants step 1; removed in step 3)
        run: |
          c=supabase_db_mouldtrack
          echo "=== SNAPSHOT BEGIN"
          docker exec -i $c psql -U postgres -v ON_ERROR_STOP=1 -qAt < scripts/privilege-snapshot.sql
          echo "=== SNAPSHOT END"
          echo "=== DIAG owners (non-postgres) in scope"
          docker exec -i $c psql -U postgres -qAt -c "select n.nspname, c.relkind, pg_get_userbyid(c.relowner), count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','app','app_policy') and c.relkind in ('r','p','v','m','S') and pg_get_userbyid(c.relowner)<>'postgres' group by 1,2,3"
          docker exec -i $c psql -U postgres -qAt -c "select n.nspname, pg_get_userbyid(p.proowner), count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','app','app_policy') and pg_get_userbyid(p.proowner)<>'postgres' group by 1,2"
          echo "=== DIAG default acls"
          docker exec -i $c psql -U postgres -qAt -c "select pg_get_userbyid(defaclrole), coalesce(defaclnamespace::regnamespace::text,'-'), defaclobjtype, defaclacl from pg_default_acl order by 1,2,3"
          echo "=== DIAG storage grants"
          docker exec -i $c psql -U postgres -qAt -c "select table_name, grantee, string_agg(privilege_type, ',' order by privilege_type) from information_schema.role_table_grants where table_schema='storage' and grantee in ('anon','authenticated','service_role') group by 1,2 order by 1,2"
          echo "=== DIAG end"
      - name: pgTAP (RLS / tenant isolation)
        run: |
          mkdir -p test-results
          set -o pipefail
          npx supabase test db 2>&1 | tee test-results/db.tap
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-db
          path: test-results/
          retention-days: 90
          if-no-files-found: warn

  # dev-reset D10: the permanent spike. dev-reset runs in LOCAL mode against this job's own ephemeral stack (Auth + Storage included, no secrets).
  # Proves what `supabase db reset --remote=<db url>` clears, that it never prompts, that the `attachments` bucket survives/recreates, that the
  # explicit Auth/Storage clearing leaves exactly the one-run baseline, and (second round) that counts do not grow.
  reset-roundtrip:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash # S3: -eo pipefail, so `cmd | tee file` fails when cmd fails
    env:
      SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta
      APP_ENV: local
      MAX_AUDIT_LOG_ROWS: '50' # local round-trip: 0 after dev-reset (it clears the log at its end)
      MAX_DB_MB: '60' # local round-trip: 14-15 MB
      E2E_FIXTURE_PASSWORD: local-e2e-Passw0rd!   # the public local literal (same as supabase/seed.sql), not a secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Start ephemeral Supabase (migrations + seed only)
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: psql (used by dev-reset for NOTIFY/audit-log clean-up and by the checks)
        run: command -v psql >/dev/null || { sudo apt-get update -y && sudo apt-get install -y postgresql-client; }
      - name: Local stack keys (CLI defaults, not secrets)
        run: |
          eval "$(npx supabase status -o env 2>/dev/null | grep -E '^[A-Z_]+=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
          } >> "$GITHUB_ENV"
      - name: Fixtures, demo tenant and throwaway data (round 1)
        run: |
          mkdir -p test-results
          npm run fixtures:reset
          npm run dev:demo-seed
          npx tsx scripts/ci-reset-pollute.ts
      - name: The size check detects the extra data (it must fail here)
        run: |
          if npm run -s dev:size-check > test-results/counts-before-reset.txt 2> test-results/size-check-before.err; then
            echo "size check passed on a polluted database"; exit 1
          fi
          cat test-results/size-check-before.err
          grep -q 'auth_users: expected' test-results/size-check-before.err
          grep -q 'storage_objects: expected' test-results/size-check-before.err
          grep -q 'audit_event: expected' test-results/size-check-before.err
      - name: dev-reset (local mode, 127.0.0.1 = the CLI's local-database path)
        run: |
          npm run dev:reset 2>&1 | tee test-results/dev-reset-1.log
          grep -q 'Resetting local database' test-results/dev-reset-1.log
      - name: Size check after reset = exact one-run baseline (0 throwaway Auth users, 0 Storage objects)
        run: |
          npm run -s dev:size-check > test-results/counts-1.txt
          cat test-results/counts-1.txt
          grep -qx 'storage_objects=0' test-results/counts-1.txt
          grep -qx 'audit_event=0' test-results/counts-1.txt
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v max_audit="$MAX_AUDIT_LOG_ROWS" -v max_db_mb="$MAX_DB_MB" -f scripts/dev-bounds.sql 2>&1 | tee test-results/bounds-1.log
      - name: Demo tenant is consistent with the server calculation and tenant-isolated
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/demo-checks.sql 2>&1 | tee test-results/demo-checks.log
      - name: Round 2 - throwaway data again, reset again through 0.0.0.0 (the CLI's remote-database path, as hosted dev), identical counts (no growth)
        run: |
          npx tsx scripts/ci-reset-pollute.ts
          SUPABASE_DB_URL="${SUPABASE_DB_URL/127.0.0.1/0.0.0.0}" npm run dev:reset 2>&1 | tee test-results/dev-reset-2.log
          grep -q 'Resetting remote database' test-results/dev-reset-2.log
          npm run -s dev:size-check > test-results/counts-2.txt
          diff test-results/counts-1.txt test-results/counts-2.txt
          echo "counts identical across resets"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v max_audit="$MAX_AUDIT_LOG_ROWS" -v max_db_mb="$MAX_DB_MB" -f scripts/dev-bounds.sql 2>&1 | tee test-results/bounds-2.log
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/demo-checks.sql
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-reset-roundtrip
          path: test-results/
          retention-days: 90
          if-no-files-found: warn

  e2e-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This job runs the edge runtime (02, D7): the Edge Functions are part of what it tests.
      # 07 (issue photos): the Storage API runs here because the API and web specs upload and read photos through it (policies on storage.objects, signed URLs).
      SUPABASE_EXCLUDE: studio,imgproxy,logflare,vector,realtime,postgres-meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Local setup token for the edge runtime (D11; a non-secret literal, never in config.toml and never pushed to a hosted project)
        run: echo 'PLATFORM_SETUP_TOKEN=local-setup-token-not-a-secret-0123456789' > supabase/functions/.env
      - name: Start ephemeral Supabase (migrations + seed only)
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - run: bash scripts/ci-supabase-env.sh
      - name: Ensure the Edge Functions are served (D7)
        run: |
          wait_fn() {
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:15321/functions/v1/account || true)
              [ "$code" = "204" ] && return 0
              sleep 2
            done
            return 1
          }
          if ! wait_fn; then
            echo "supabase start did not serve supabase/functions; falling back to functions serve"
            nohup npx supabase functions serve --no-verify-jwt=false > functions-serve.log 2>&1 &
            wait_fn || { cat functions-serve.log; exit 1; }
          fi
      - name: API test env (local stack keys from the CLI; not secrets)
        run: |
          eval "$(npx supabase status -o env 2>/dev/null | grep -E '^[A-Z_]+=')"
          {
            echo "E2E_API_URL=$API_URL"
            echo "E2E_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "E2E_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "E2E_REQUIRE_API=1"
          } >> "$GITHUB_ENV"
      - name: Build web
        run: npx expo export -p web --output-dir dist
      - run: npx playwright install --with-deps chromium
      - name: Playwright (api + e2e + smoke)
        env:
          CI: 'true'
          BASE_URL: http://localhost:8081
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-e2e-web
          path: |
            test-results/
            playwright-report/
          retention-days: 90
          if-no-files-found: warn

  summary:
    needs: [changes, static, db, reset-roundtrip, e2e-web]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { path: evidence, pattern: 'results-*' }
      - run: node scripts/regression-summary.mjs evidence --title "PR CI evidence" --env ci-ephemeral >> "$GITHUB_STEP_SUMMARY"

  # Single required check for branch protection. Skipped suites (docs-only) count as success.
  ci-ok:
    needs: [changes, static, db, reset-roundtrip, e2e-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          if grep -Eq '"result": "(failure|cancelled)"' needs.json; then
            echo "A required job failed or was cancelled"; cat needs.json; exit 1
          fi
          echo "ok (code changed: ${{ needs.changes.outputs.code }})"
