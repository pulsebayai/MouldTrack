# Verifies the hosted-environment secrets exist and work. Prints only pass/fail, never values.
# Manual (Actions → secrets-check → Run workflow) and on pushes that change this file.
name: secrets-check

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/secrets-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      DEV_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
      DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
      DEV_SUPABASE_DB_URL: ${{ secrets.DEV_SUPABASE_DB_URL }}
      DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Present
        run: |
          fail=0
          for n in DEV_SUPABASE_URL DEV_SUPABASE_ANON_KEY DEV_SUPABASE_SERVICE_ROLE_KEY DEV_SUPABASE_DB_URL \
                   DEV_SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN E2E_FIXTURE_PASSWORD EXPO_TOKEN SENTRY_DSN SENTRY_AUTH_TOKEN; do
            if [ -n "${!n}" ]; then echo "✅ $n present"; else echo "❌ $n MISSING"; fail=1; fi
          done
          [ ${#E2E_FIXTURE_PASSWORD} -ge 16 ] && echo "✅ E2E_FIXTURE_PASSWORD length ≥ 16" || { echo "❌ E2E_FIXTURE_PASSWORD shorter than 16"; fail=1; }
          exit $fail
      - name: Supabase URL matches project ref
        if: always()
        run: |
          # Diagnostics only describe the SHAPE of the values, never the values themselves.
          ref_ok=$(printf '%s' "$DEV_SUPABASE_PROJECT_REF" | grep -Eq '^[a-z]{20}$' && echo yes || echo no)
          echo "ref: length ${#DEV_SUPABASE_PROJECT_REF}, looks like a 20-letter project ref: $ref_ok"
          printf '%s' "$DEV_SUPABASE_URL" | grep -q '^https://' && echo "url: starts with https:// ✓" || echo "url: does NOT start with https://"
          printf '%s' "$DEV_SUPABASE_URL" | grep -Eq '\.supabase\.co/?$' && echo "url: ends with .supabase.co ✓" || echo "url: does NOT end with .supabase.co (extra path like /rest/v1, or a different host?)"
          printf '%s' "$DEV_SUPABASE_URL" | grep -q "$DEV_SUPABASE_PROJECT_REF" && echo "url: contains the ref ✓" || echo "url: does NOT contain the ref"
          printf '%s' "$DEV_SUPABASE_URL" | grep -q '[[:space:]]' && echo "url: contains whitespace/newline ✗" || true
          case "$DEV_SUPABASE_URL" in
            "https://${DEV_SUPABASE_PROJECT_REF}.supabase.co"|"https://${DEV_SUPABASE_PROJECT_REF}.supabase.co/") echo "✅ URL ↔ ref";;
            *) echo "❌ DEV_SUPABASE_URL is not https://<DEV_SUPABASE_PROJECT_REF>.supabase.co"; exit 1;;
          esac
      - name: Supabase Auth reachable with anon key; email confirmation off
        if: always()
        run: |
          s=$(curl -s -o /tmp/settings.json -w '%{http_code}' -H "apikey: $DEV_SUPABASE_ANON_KEY" "$DEV_SUPABASE_URL/auth/v1/settings")
          [ "$s" = "200" ] && echo "✅ auth settings reachable (anon key valid)" || { echo "❌ auth settings HTTP $s"; exit 1; }
          if jq -e '.mailer_autoconfirm == true' /tmp/settings.json >/dev/null; then echo "✅ Confirm email is OFF"; else echo "❌ Confirm email is still ON (Authentication → Sign In / Providers → Email)"; exit 1; fi
      - name: Service role key valid (admin API, read-only)
        if: always()
        run: |
          s=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $DEV_SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $DEV_SUPABASE_SERVICE_ROLE_KEY" "$DEV_SUPABASE_URL/auth/v1/admin/users?per_page=1")
          [ "$s" = "200" ] && echo "✅ service role key valid" || { echo "❌ admin API HTTP $s"; exit 1; }
      - name: Database URL connects
        if: always()
        run: |
          sudo apt-get -qq install -y postgresql-client >/dev/null 2>&1 || true
          printf '%s' "$DEV_SUPABASE_DB_URL" | grep -q 'pooler.supabase.com' && echo "db url: session pooler host ✓" || echo "db url: NOT the pooler host (direct db.<ref>.supabase.co is IPv6-only; GitHub runners are IPv4)"
          v=$(psql "$DEV_SUPABASE_DB_URL" -Atc "select current_setting('server_version_num')::int >= 150000" 2>/tmp/psql.err) \
            && echo "✅ database reachable (Postgres ≥ 15: $v)" \
            || { echo "❌ database connection failed: $(sed -E 's#postgres(ql)?://[^ ]*#<redacted>#g' /tmp/psql.err | head -2)"; exit 1; }
      - name: Supabase access token sees the dev project in ap-south-1
        if: always()
        run: |
          r=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$DEV_SUPABASE_PROJECT_REF" | jq -r '.region // empty')
          [ -n "$r" ] && echo "✅ access token valid; region: $r" || { echo "❌ access token cannot read the dev project"; exit 1; }
          [ "$r" = "ap-south-1" ] && echo "✅ region is Mumbai (ap-south-1)" || { echo "❌ region is $r, expected ap-south-1"; exit 1; }
      - name: Expo token valid
        if: always()
        run: |
          u=$(npx --yes eas-cli@latest whoami 2>/dev/null | head -1)
          [ -n "$u" ] && echo "✅ Expo token valid (account: $u)" || { echo "❌ Expo token invalid"; exit 1; }
      - name: Sentry DSN and token valid
        if: always()
        run: |
          case "$SENTRY_DSN" in https://*@*.ingest*sentry.io/*) echo "✅ DSN format";; *) echo "❌ SENTRY_DSN format unexpected"; exit 1;; esac
          # Org tokens (sntrys_...) embed their org slug in a base64 JSON segment and may not list orgs; test what CI needs.
          if [ "${SENTRY_AUTH_TOKEN#sntrys_}" != "$SENTRY_AUTH_TOKEN" ]; then
            payload=$(printf '%s' "$SENTRY_AUTH_TOKEN" | cut -d_ -f2)
            org=$(printf '%s==' "$payload" | base64 -d 2>/dev/null | jq -r '.org // empty' 2>/dev/null)
            [ -n "$org" ] && echo "token type: organization token (org: $org)" || { echo "❌ could not read org from organization token"; exit 1; }
            s=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" "https://sentry.io/api/0/organizations/$org/releases/?per_page=1")
          else
            echo "token type: personal/user token"
            s=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" https://sentry.io/api/0/organizations/)
          fi
          [ "$s" = "200" ] && echo "✅ Sentry token valid for releases" || { echo "❌ Sentry token HTTP $s"; exit 1; }
