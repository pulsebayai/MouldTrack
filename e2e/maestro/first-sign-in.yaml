# 02 AC-3 (Android): a fresh temporary-password user (fixture U4) is forced to change it, then must sign in again with the new password and lands on Home (D14).
# Fixture U4 is reset to its temporary password before each run (fixtures-reset), so this flow is repeatable.
appId: com.pulsebayai.mouldtrack
name: first-sign-in
---
- launchApp: { clearState: true }
# Cold launch after clearState can exceed Maestro's ~17 s implicit wait on the software-GPU emulator (nightlies 45934867345, 46101637456).
- extendedWaitUntil: { visible: { id: "phone" }, timeout: 60000 }
- tapOn: { id: "phone" }
- inputText: "9000000009"
- tapOn: { id: "password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- assertVisible: { id: "change-password-screen" }
- assertNotVisible: { id: "home-tenant" }
- tapOn: { id: "current-password" }
- inputText: ${PASSWORD}
- tapOn: { id: "new-password" }
- inputText: "Maestro-first-2026"
- tapOn: { id: "confirm-password" }
- inputText: "Maestro-first-2026"
- hideKeyboard
- tapOn: { id: "change-password-submit" }
# D14: Auth ends every session on a password change, so the app returns to sign-in with a notice.
- assertVisible: { id: "sign-in-notice", text: "Password changed. Sign in with your new password." }
- tapOn: { id: "phone" }
- inputText: "9000000009"
- tapOn: { id: "password" }
- inputText: "Maestro-first-2026"
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- assertVisible: { id: "home-tenant", text: "e2e org U" }
