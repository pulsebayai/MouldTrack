# 07 (Android): a supervisor reports an issue from "My shift" without a photo (D8: emulator camera/gallery automation is unreliable; the
# photo path is proven by the API and web e2e and on a real phone at the R1 gate), then works it to Closed. Fixture org A: supA owns FX-MA1
# on both fixture shifts. The issue is Low so resolving it closes it (the fixture issues are never touched).
appId: com.pulsebayai.mouldtrack
name: report-issue
---
- launchApp: { clearState: true }
- tapOn: { id: "phone" }
- inputText: "9000000002"
- tapOn: { id: "password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- extendedWaitUntil: { visible: { id: "my-shift-state-0", text: "Running now" }, timeout: 15000 }
- scrollUntilVisible: { element: { id: "report-issue-.*" }, timeout: 15000 }
- tapOn: { id: "report-issue-.*" }
- extendedWaitUntil: { visible: { id: "report-screen" }, timeout: 15000 }
- tapOn: "Mechanical"
- tapOn: { id: "report-priority-low" }
- tapOn: { id: "report-description" }
- inputText: "Maestro guard door sticks"
- hideKeyboard
- scrollUntilVisible: { element: { id: "report-submit" } }
- tapOn: { id: "report-submit" }
- extendedWaitUntil: { visible: { id: "issue-status", text: "Open" }, timeout: 15000 }
- assertVisible: "Maestro guard door sticks"
- tapOn: { id: "action-start" }
- extendedWaitUntil: { visible: { id: "issue-status", text: "In progress" }, timeout: 15000 }
- tapOn: { id: "action-resolve" }
- tapOn: { id: "action-text" }
- inputText: "Oiled the hinge"
- hideKeyboard
- scrollUntilVisible: { element: { id: "action-submit" } }
- tapOn: { id: "action-submit" }
- extendedWaitUntil: { visible: { id: "issue-status", text: "Closed" }, timeout: 15000 }
