# AC-5 (Android): session survives an app restart.
appId: com.pulsebayai.mouldtrack
name: relaunch
---
- launchApp: { clearState: true }
# Cold launch after clearState can exceed Maestro's ~17 s implicit wait on the software-GPU emulator (nightlies 45934867345, 46101637456).
- extendedWaitUntil: { visible: { id: "phone" }, timeout: 60000 }
- tapOn: { id: "phone" }
- inputText: "9000000003"
- tapOn: { id: "password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- assertVisible: { id: "home-tenant", text: "e2e org B" }
- stopApp
- launchApp: { clearState: false }
- extendedWaitUntil: { visible: { id: "home-tenant", text: "e2e org B" }, timeout: 60000 }
