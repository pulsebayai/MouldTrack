# AC-3 (Android): sign-out returns to sign-in.
appId: com.pulsebayai.mouldtrack
name: sign-out
---
- launchApp: { clearState: true }
- tapOn: { id: "phone" }
- inputText: "9000000001"
- tapOn: { id: "password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- assertVisible: "Role: Unit Admin"
- tapOn: { id: "sign-out" }
- assertVisible: { id: "sign-in-submit" }
