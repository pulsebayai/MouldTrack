# AC-2 (Android): wrong password shows the plain error and stays on sign-in.
appId: com.pulsebayai.mouldtrack
name: bad-password
---
- launchApp: { clearState: true }
# Cold launch after clearState can exceed Maestro's ~17 s implicit wait on the software-GPU emulator (nightlies 45934867345, 46101637456).
- extendedWaitUntil: { visible: { id: "phone" }, timeout: 60000 }
- tapOn: { id: "phone" }
- inputText: "9000000002"
- tapOn: { id: "password" }
- inputText: "definitely-wrong-password"
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- assertVisible: "Phone number or password is incorrect"
- assertVisible: { id: "sign-in-submit" }
