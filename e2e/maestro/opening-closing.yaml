# 06 (Android): a supervisor records the opening and the closing reading of the machine they own in the running shift, without a photo (D8 of 07:
# emulator camera/gallery automation is unreliable; the photo path is proven by the API and web e2e and on a real phone at the R1 gate).
# Fixture org A: supA owns FX-MA1 on both fixture shifts, so one occurrence is always running. Readings are append-only history, so a re-run on
# the same day finds them done: each step runs only while the server offers it for the PINNED machine FX-MA1 (matched by its button text, at most
# 3 occurrences per kind), and the flow fails unless FX-MA1 ends with an occurrence that has both readings (N-11: it cannot pass by doing nothing).
appId: com.pulsebayai.mouldtrack
name: opening-closing
---
- launchApp: { clearState: true }
- tapOn: { id: "phone" }
- inputText: "9000000002"
- tapOn: { id: "password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- extendedWaitUntil: { visible: { id: "readings-link" }, timeout: 15000 }
- tapOn: { id: "readings-link" }
- extendedWaitUntil: { visible: { id: "readings" }, timeout: 15000 }
- extendedWaitUntil: { visible: "Opening reading due|Opening recorded.*|Closing reading due|Both readings recorded|Opening overdue.*", timeout: 15000 }
- repeat:
    while: { visible: "Record opening for FX-MA1" }
    times: 3
    commands:
      - tapOn: "Record opening for FX-MA1"
      - extendedWaitUntil: { visible: { id: "record-opening-screen" }, timeout: 15000 }
      - extendedWaitUntil: { visible: { id: "record-counter" }, timeout: 15000 }
      - assertVisible: "FX-MA1 · Fixture Machine A1"
      - tapOn: { id: "record-product-.*" }
      - tapOn: { id: "record-counter" }
      - inputText: "1000"
      - hideKeyboard
      - scrollUntilVisible: { element: { id: "record-submit" } }
      - tapOn: { id: "record-submit" }
      - extendedWaitUntil: { visible: { id: "readings" }, timeout: 15000 }
- repeat:
    while: { visible: "Record closing for FX-MA1" }
    times: 3
    commands:
      - tapOn: "Record closing for FX-MA1"
      - extendedWaitUntil: { visible: { id: "record-closing-screen" }, timeout: 15000 }
      - assertVisible: "FX-MA1 · Fixture Machine A1"
      - tapOn: { id: "record-counter" }
      - inputText: "1250"
      - tapOn: { id: "record-good" }
      - inputText: "240"
      - tapOn: { id: "record-reject" }
      - inputText: "5"
      - hideKeyboard
      - scrollUntilVisible: { element: { id: "record-submit" } }
      - tapOn: { id: "record-submit" }
      - extendedWaitUntil: { visible: { id: "readings" }, timeout: 15000 }
# N3: the state line of FX-MA1 itself (testID reading-state-<shift>-<machine id>-<date>). The machine id is NOT pinned: on hosted dev the fixture machine is
# created by fixtures-reset with a generated id (seed.sql's 43000000-...-a1 only exists on the local stack), proven by the failure context of regression
# 44331151688 (id 4294277e-... on screen). supA owns only FX-MA1 in org A, so this list holds no other machine; the buttons above are pinned by text.
- scrollUntilVisible: { element: { id: "reading-state-.*", text: "Both readings recorded" }, timeout: 15000 }
- scrollUntilVisible: { element: "Details for FX-MA1", timeout: 15000 }
- assertNotVisible: "Record closing for FX-MA1"
